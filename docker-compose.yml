version: '3.4'

services:
  eshopwebmvc:
    image: ${DOCKER_REGISTRY-}eshopwebmvc
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    depends_on:
      - "sqlserver"
      - "eshoporderservice"
      - "eshopcatalogservice"
      - "rabbitmq"
  eshoppublicapi:
    image: ${DOCKER_REGISTRY-}eshoppublicapi
    build:
      context: .
      dockerfile: src/PublicApi/Dockerfile
    depends_on:
      - "sqlserver"
  eshoporderservice:
    image: ${DOCKER_REGISTRY-}eshoporderservice
    build:
      context: .
      dockerfile: OrderService/OrderService/Dockerfile
    depends_on:
      - "sqlserver"
  eshopcatalogservice:
    image: ${DOCKER_REGISTRY-}eshopcatalogservice
    build:
      context: .
      dockerfile: CatalogService/CatalogService.Api/Dockerfile
    depends_on:
      - "sqlserver"
      - "rabbitmq"
  eshopapigateway:
    image: ${DOCKER_REGISTRY-}eshopapigateway
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    depends_on:
      - "eshoppublicapi"
      - "eshopcatalogservice"
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    ports:
      - "1433:1433"
    environment:
      - SA_PASSWORD=@someThingComplicated1234
      - ACCEPT_EULA=Y
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # The built-in "guest" user may only log in from inside the RabbitMQ container itself,
      # so the other containers use this user instead.
      - RABBITMQ_DEFAULT_USER=eshop
      - RABBITMQ_DEFAULT_PASS=eshop

