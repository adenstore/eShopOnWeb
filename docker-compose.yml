version: '3.4'

services:
  eshopwebmvc:
    image: ${DOCKER_REGISTRY-}eshopwebmvc
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    depends_on:
      - "sqlserver"
      - "eshoporderservice"
      - "eshopcatalogservice"
      - "rabbitmq"
      - "eshopapigateway"
  eshoppublicapi:
    image: ${DOCKER_REGISTRY-}eshoppublicapi
    build:
      context: .
      dockerfile: src/PublicApi/Dockerfile
    depends_on:
      - "sqlserver"
  eshoporderservice:
    image: ${DOCKER_REGISTRY-}eshoporderservice
    build:
      context: .
      dockerfile: OrderService/OrderService/Dockerfile
    depends_on:
      - "sqlserver"
      - "rabbitmq"
  eshopcatalogservice:
    image: ${DOCKER_REGISTRY-}eshopcatalogservice
    build:
      context: .
      dockerfile: CatalogService/CatalogService.Api/Dockerfile
    depends_on:
      - "sqlserver"
      - "rabbitmq"
  eshopbasketservice:
    image: ${DOCKER_REGISTRY-}eshopbasketservice
    build:
      context: .
      dockerfile: BasketService/BasketService/Dockerfile
    depends_on:
      - "sqlserver"
      - "rabbitmq"
  eshoplagerservice:
    image: ${DOCKER_REGISTRY-}eshoplagerservice
    build:
      context: .
      dockerfile: LagerService/LagerService/Dockerfile
    depends_on:
      - "redis"
      - "rabbitmq"
  eshopapigateway:
    image: ${DOCKER_REGISTRY-}eshopapigateway
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    depends_on:
      - "eshoppublicapi"
      - "eshopcatalogservice"
      - "eshoporderservice"
      - "eshoplagerservice"
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    ports:
      - "1433:1433"
    environment:
      - SA_PASSWORD=${SA_PASSWORD:?Copy .env.example to .env}
      - ACCEPT_EULA=Y
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # The built-in "guest" user may only log in from inside the RabbitMQ container itself,
      # so the other containers use this user instead.
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?Copy .env.example to .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?Copy .env.example to .env}
  redis:
    # LagerService stores its stock here (key-value database instead of SQL Server).
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
